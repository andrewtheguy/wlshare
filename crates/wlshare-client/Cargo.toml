[package]
name = "wlshare-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wlshare's desktop client, everything but the window: the RFB session, the framebuffer, the pointer, the clipboard and the sound, under the macOS and Windows apps"

# Platform-independent, as wlshare-rfb is: the apps build it for macOS arm64
# and Windows x64, and it is tested by a bare `cargo test` on any OS. What is
# about a platform — its key codes, its scrolls, its C ABI — stays in each
# app's own core, which depends on this by the workspace's release tag.
[dependencies]
# `decode` is the FLAC decoder the sound needs, and VP9's decoder; the daemon
# leaves it off.
wlshare-rfb = { path = "../wlshare-rfb", features = ["decode"] }
anyhow.workspace = true
log.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "sync", "time", "macros"] }

[dev-dependencies]
# The session's tests play the server, which encodes what it sends.
wlshare-rfb = { path = "../wlshare-rfb", features = ["decode", "encode"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
# The live tests talk to a real server; `RUST_LOG=debug` is how one says what it
# sent when it did not send what was expected.
env_logger = "0.11"
