[package]
name = "wlshare-proto"
# The protocol version, `version::PROTOCOL_VERSION`, as the major version and
# nothing else: any change to this crate is a new one, tagged `proto-v<N>` by
# the release that brings it, and that tag is what the gateway pins.
version = "8.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wlshare's private RFB extensions, both ends of them: what the daemon sends and the zDesk gateway reads, and back"

# The one crate outside this workspace may depend on: the zDesk gateway pins it
# by its `proto-v<N>` tag, behind its `wlshare` feature. Every byte of
# a private extension is built and parsed here, for the daemon and the gateway
# alike, so the two ends cannot disagree about one. Nothing but `thiserror`, so
# a gateway that takes it takes no codec, no C and no OS API with it.
[dependencies]
thiserror.workspace = true
