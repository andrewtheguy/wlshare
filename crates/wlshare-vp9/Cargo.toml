[package]
name = "wlshare-vp9"
version.workspace = true
edition.workspace = true
# libvpx's BSD-3-Clause beside the workspace's MIT: it is linked in statically
# (LICENSE-libvpx).
license = "MIT AND BSD-3-Clause"
repository.workspace = true
description = "VP9 for a desktop picture, as wlshare codes it: 8-bit 4:4:4 or 4:2:0 pinned to a 1–100 quality dial, coded by libvpx, BT.601 planes in front of it, the decoder, what a frame says about itself, and the walk of the dial a link will bear"

# The one place libvpx is spoken to. Platform-independent and dependency-light
# on purpose, as the protocol crate is: it builds and unit-tests on any OS, and
# nothing about a wire is decided here.
[dependencies]
thiserror.workspace = true
log.workspace = true
# libvpx 1.16 as a static archive for this target, downloaded and checked by the
# crate's build script — nothing to configure, assemble or install. The archives
# cover macOS arm64 and Linux x86_64 and aarch64, which is everywhere this is
# built. VP9-only, built `--enable-realtime-only`. Its encoder is the coder, and
# its decoder the independent one every frame made in a test is held to.
vpx-sys = { package = "libvpx-prebuilt-sys", git = "https://github.com/andrewtheguy/libvpx-prebuilt", tag = "v1.16.0-20260924182850-e78d74f" }
# The conversions between packed RGB or BGRX and the planes an encoder takes
# and the decoder gives back: pure Rust with AVX2 and NEON paths chosen at run
# time, three to four times the speed of a scalar loop on a 4K frame. Its
# professional mode is the one to the planes whose every path, NEON with and
# without RDM, AVX2, SSE and scalar, makes the same planes of a colour.
yuv = { version = "0.8", features = ["professional_mode"] }
