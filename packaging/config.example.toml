# wlshare configuration: $XDG_CONFIG_HOME/wlshare/config.toml by default.
# Every key is optional; the values shown are the defaults unless noted.

# Where clients connect. Without [pam] or [password] below the session is
# unauthenticated and not encrypted: keep this on loopback or a VPN address, or
# put an SSH tunnel in front.
listen = "127.0.0.1:5900"

# Who may connect: a login over RSA-AES from one of the two tables below, or --
# with both left out -- anyone who reaches the port. Set one table or the other,
# never both. Classic VncAuth is not offered: it names nobody, cuts the password
# to eight characters, and leaves the session in the clear.
#
# RSA-AES with the system login: the client sends the username and password of
# the account wlshare runs as -- no other account is accepted -- and PAM checks
# them under the service below (/etc/pam.d/wlshare, installed with the package).
# Every byte after the key exchange is encrypted. The server's RSA key is
# generated on first start and kept in rsa_key_file; its fingerprint is logged
# at startup, and a remotex gateway logs the one it saw, for comparing.
# [pam]
# service = "wlshare"
# rsa_key_file = "/home/me/.config/wlshare/rsa_key.pem"   # default: beside this file

# RSA-AES with one password of your own and no account at all: the client is
# asked for a password alone, and it is checked against the Argon2 hash below.
# For a host where no system account's password should be the way in. Print the
# hash with `wlshare hash-password`, which asks for the password and never
# writes it anywhere; the same rsa_key_file applies.
# [password]
# hash = "$argon2id$v=19$m=19456,t=2,p=1$c29tZXNhbHQ$..."
# rsa_key_file = "/home/me/.config/wlshare/rsa_key.pem"   # default: beside this file

# The output to share, by its Wayland `wl_output` name. Absent means the first
# output the compositor lists. Only a HEADLESS-* output is ever resized or
# rescaled for a client.
# output = "HEADLESS-1"

# Whether clients may resize the output and set its scale.
resize = true

# The most frames captured per second.
max_fps = 60

# Seconds a connection has to finish the handshake — the security exchange and
# the login — before it is dropped. A client that shows its user the server key
# to confirm and then asks for a password (TigerVNC does both on every
# connection) spends this waiting on the person, so raise it for such clients.
handshake_timeout_secs = 20

# Whether a client may hear the desktop. A client that asks for the QEMU Audio
# extension is sent what the default sink plays, captured from PipeWire in the
# session, in the sample format the client chose. A headless session needs a
# sink for applications to play into; PipeWire's own Dummy Output, which
# WirePlumber provides when no device is present, is enough.
audio = true

# The desktop name clients see.
name = "wlshare"

# The keymap the virtual keyboard uploads and keysyms are resolved through, as
# XKB rules/model/layout/variant/options names. Empty means the library default.
# A custom layout directory is named by XKB_CONFIG_EXTRA_PATH in the environment.
[xkb]
# layout = "us"
# variant = ""
# options = ""
