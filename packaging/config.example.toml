# wlshare configuration: $XDG_CONFIG_HOME/wlshare/config.toml by default.
# Every key is optional; the values shown are the defaults unless noted.

# Where clients connect. Without [pam] below the session is unauthenticated and
# not encrypted: keep this on loopback or a VPN address, or put an SSH tunnel in
# front.
listen = "127.0.0.1:5900"

# Who may connect: the account's login over RSA-AES, or -- with the table left
# out -- anyone who reaches the port. Classic VncAuth is not offered: it names
# nobody and leaves the session in the clear.
#
# RSA-AES with the system login: the client sends the username and password of
# the account wlshare runs as -- no other account is accepted -- and PAM checks
# them under the service below (/etc/pam.d/wlshare, installed with the package).
# Every byte after the key exchange is encrypted. The server's RSA key is
# generated on first start and kept in rsa_key_file; its fingerprint is logged
# at startup, and a remotex gateway logs the one it saw, for comparing.
# [pam]
# service = "wlshare"
# rsa_key_file = "/home/me/.config/wlshare/rsa_key.pem"   # default: beside this file

# The output to share, by its Wayland `wl_output` name. Absent means the first
# output the compositor lists. Only a HEADLESS-* output is ever resized or
# rescaled for a client.
# output = "HEADLESS-1"

# Whether clients may resize the output and set its scale.
resize = true

# The most frames captured per second.
max_fps = 60

# The desktop name clients see.
name = "wlshare"

# The keymap the virtual keyboard uploads and keysyms are resolved through, as
# XKB rules/model/layout/variant/options names. Empty means the library default.
# A custom layout directory is named by XKB_CONFIG_EXTRA_PATH in the environment.
[xkb]
# layout = "us"
# variant = ""
# options = ""
