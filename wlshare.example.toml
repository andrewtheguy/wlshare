# wlshare configuration: $XDG_CONFIG_HOME/wlshare/config.toml by default.
# Every top-level key and table is optional; the values shown are the defaults
# unless noted. An enabled [password] table requires its hash.

# Where clients connect. Without [pam] or [password] below the session is
# unauthenticated and not encrypted: keep this on loopback or a VPN address, or
# put an SSH tunnel in front.
listen = "127.0.0.1:5900"

# Who may connect is one of two tables, [pam] or [password], or -- with both
# left out -- anyone who reaches the port. They are at the end of this file,
# where every table is: in TOML each key after a table's header is that
# table's, so a table uncommented above the keys below would take them.

# The output to share, by its Wayland `wl_output` name. Absent means the first
# output the compositor lists. Only a HEADLESS-* output is ever resized or
# rescaled for a client. An output of this name the compositor does not have --
# a disabled one -- is not an error: another is shared meanwhile, and the
# desktop moves to this one when it appears.
# output = "HEADLESS-1"
#
# A client may ask for one or two virtual displays, as an RDP client asks a
# Windows host for its monitors. On sway the daemon makes and unplugs
# HEADLESS-* outputs through sway's IPC, found in SWAYSOCK, until there are
# that many; nothing here sets it, and on another compositor the outputs are
# what it has. See docs/architecture.md, "Virtual displays".

# Seconds a client taking the desktop is kept waiting, before it is told the
# desktop's size, while the compositor has no `output`. For a headless output
# that is only enabled while a client is on the desktop: the watcher below
# enables it in its --held command, which runs when the client takes the
# desktop, and the client starts on it instead of on a monitor. It goes on the
# moment the output is shared, and on the output shared meanwhile when the wait
# runs out. Zero keeps nobody waiting.
# output_wait_secs = 0

# A client may always resize the output and set its scale -- a HEADLESS-* one
# alone; a monitor keeps the modes it has. Nothing here turns that off.

# The most frames captured per second; the zDesk page draws at most 30, so a
# frame past it is coded and sent for nothing.
max_fps = 30

# Seconds a connection has to finish the handshake — the security exchange and
# the login — before it is dropped. A client that shows its user the server key
# to confirm and then asks for a password (TigerVNC does both on every
# connection) spends most of this waiting on the person.
handshake_timeout_secs = 120

# A client may always hear the desktop, and lend it its camera and microphone;
# nothing here turns those off, and the package depends on the PipeWire,
# WirePlumber and pipewire-pulse they run through.
#
# While a client that asks for wlshare's audio extension (the zDesk gateway, in
# a session started with sound) has it enabled, wlshare adds a PipeWire sink of
# its own, "wlshare remote audio", and makes it the default: every stream that
# follows the default plays there and is silent on the host, and one an
# application pinned to a sink of the host's is still heard on it. What that
# sink plays is sent in the sample format the client chose, encoded as FLAC or
# as Opus, whichever the client asked for. When the last client stops listening
# the sink goes and the host's own is the default again. A headless session
# needs no sink of its own: wlshare's is one.
#
# A client that asks for the camera extension (the zDesk gateway, for a session
# started with Camera ticked) plugs its browser's camera and sends H.264, which
# becomes a PipeWire video source named "wlshare remote camera" -- one that
# applications reaching cameras through PipeWire (a browser's camera portal,
# OBS, GStreamer) can open. It sends frames only while one of them has it open.
# A browser reaches it through xdg-desktop-portal with xdg-desktop-portal-gtk,
# which the package recommends; Chrome also needs
# chrome://flags/#enable-webrtc-pipewire-camera.
# One that asks for the microphone extension plugs its microphone, which becomes
# a PipeWire audio source named "wlshare remote microphone" that applications
# record from like any other. The client sends 16-bit PCM only while one of
# them is recording.

# Whether the video -- the whole desktop as one stream, what a zDesk session
# started with "Video" is sent -- and the tiles picture's moving regions, of
# "Tiles with motion", are coded by the host's hardware H.264 encoder, through
# VA-API; on by default. wlshare looks for one at startup, the shader encoder
# ahead of the low-power one where a GPU has both (it sends fewer bytes for a
# closer picture), and logs what it found; with none, or with this off,
# both are H.264 by libx264 on the CPU, at its fastest preset. With neither
# working wlshare does not start, and a session whose H.264 coder cannot be
# opened, or fails a frame, ends, which the log says. The hardware needs a
# VA-API driver for the GPU (intel-media-va-driver, mesa-va-drivers). A host
# with no GPU can borrow another machine's: the [enc_agent] table at the end
# of this file, experimental, which this key has to be on for.
hardware_h264 = true

# Have zDesk outline what the tiles picture streams as video, for seeing what
# is made a video of and when: magenta around what moves in a region whose
# tiles kept changing, orange around one a single change was too large to send
# as stills. Only on the picture zDesk asks for with a picture that settles
# lossless, the only one with regions. The outline is drawn by zDesk's page
# over the picture, around the pixels that changed and not the tiles they are
# in, and goes when the region ends, a moment after it stops moving. The
# picture itself is the same with it as without: the daemon sends a few bytes
# saying where, and codes nothing more. Off by default.
#motion_debug = true

# The desktop name clients see.
name = "wlshare"

# A Unix socket that tells whoever connects whether a client is on the desktop:
# one line, `held` or `free`, and another each time that changes. Under
# $XDG_RUNTIME_DIR when the path is relative; only the account the daemon runs
# as can connect. A takeover is the desktop passing from one client to another
# and is not a change. Absent means no socket.
#
# The socket closes when the daemon is gone, however it went, and that is what
# it is for: `wlshare watch` follows it from a process of its own, reads a
# daemon it cannot reach as a desktop nobody holds, and runs a command for each
# of the two through `sh -c`:
#
#   wlshare watch --held "..." --free "..." [--free-after-secs 5] [--timeout-secs 60]
#
# --held runs when a client is on the desktop and --free when nobody has been
# for --free-after-secs, so neither runs for a client that leaves and reconnects
# inside the wait, nor for a daemon restarted inside it. The first to run is the
# one for where the desktop stands when the watcher starts, so both have to be
# safe to run twice. One runs at a time, for at most --timeout-secs before it is
# killed. A watcher stopped while the desktop is held runs --free before it
# exits.
#
# The case it is for: a sway session whose windows should move onto the
# headless output a remote client is shown while the monitors go dark, and
# back when it leaves. With `output = "HEADLESS-1"` above and a headless output
# created at session start (`swaymsg create_output`, placed where no monitor is
# adjacent), the watcher is started by the session, from a user unit beside
# wlshare's or with sway's `exec`:
#
#   wlshare watch \
#       --held "swaymsg 'output DP-1 disable, output DP-2 disable'" \
#       --free "swaymsg 'output DP-1 enable, output DP-2 enable'"
#
# since sway moves a disabled output's workspaces to an enabled one. A desktop
# left dark is recovered the same way from a console or over SSH, with SWAYSOCK
# set: `swaymsg 'output * enable'`.
#
# For a headless output that exists only while a client is on the desktop, set
# output_wait_secs above, enable it first in --held and disable it last in
# --free, once the monitors are back:
#
#   wlshare watch \
#       --held "swaymsg 'output HEADLESS-1 enable, output DP-1 disable'" \
#       --free "swaymsg 'output DP-1 enable, output HEADLESS-1 disable'"
# state_socket = "wlshare/state.sock"

# The tables, last, so that one uncommented where it stands takes no key that
# is not its own.

# Who may connect: a login over RSA-AES from one of the two tables below, or --
# with both left out -- anyone who reaches the port. Set one table or the other,
# never both. Classic VncAuth is not offered: it names nobody, cuts the password
# to eight characters, and leaves the session in the clear.
#
# RSA-AES with the system login: the client sends the username and password of
# the account wlshare runs as -- no other account is accepted -- and PAM checks
# them under the service below (/etc/pam.d/wlshare, installed with the package).
# Every byte after the key exchange is encrypted. The server's RSA key is
# generated on first start and kept in rsa_key_file; its fingerprint is logged
# at startup, and a zDesk gateway logs the one it saw, for comparing.
# [pam]
# service = "wlshare"
# rsa_key_file = "/home/me/.config/wlshare/rsa_key.pem"   # default: beside this file

# RSA-AES with one password of your own and no account at all: the client is
# asked for a password alone, and it is checked against the Argon2 hash below.
# For a host where no system account's password should be the way in. Print the
# hash with `wlshare hash-password`, which asks for the password and never
# writes it anywhere; the same rsa_key_file applies.
# [password]
# hash = "$argon2id$v=19$m=19456,t=2,p=1$c29tZXNhbHQ$..."
# rsa_key_file = "/home/me/.config/wlshare/rsa_key.pem"   # default: beside this file

# Experimental: the hardware H.264 encoder of another machine, for a host with
# no GPU of its own, whose video and moving regions are otherwise libx264's,
# on its CPU. It is for a wired link that is very fast, and above all for a
# virtual machine borrowing the encoder of the host it runs on.
# docs/enc-agent.md is how to set both machines up, with a virtual machine
# and its host from start to finish. That machine runs the encoding agent, a
# program of its own that needs libva and a VA-API driver and nothing else of
# wlshare's:
#
#   wlshare-enc-agent --listen 192.168.1.20:5990 --allow 192.168.1.10/32 [--key-file FILE]
#
# and this table names where it listens: the address and the port are yours
# to choose, 5990 being no default, and the agent has none. A host name does
# for the address, looked up once and taken at the first address it has, so
# one with several, IPv6 beside IPv4, is better written as the address. The
# two machines are a virtual machine or container, as this host would be, and
# the host it runs on, or a sibling there, that has the host's GPU, the
# pictures crossing a bridge inside the one machine; or two wired machines on
# a LAN faster than gigabit. It is not for Wi-Fi or a link between sites.
#
# --allow is where this host connects from, as an IPv4 or IPv6 CIDR block,
# and the agent does not start without one: a single address is a /32 (a
# /128 for IPv6), and more are given by repeating the option. The agent
# closes a connection from anywhere else unanswered. Name this host's own
# address there and not its network: an agent that allows a whole network
# lets every machine on it try the key, though one with the wrong key gets
# no answer either.
#
# With the table, and hardware_h264 on, every
# H.264 stream is coded there: wlshare sends the agent what changed of each
# picture, uncompressed, and is sent the frame back, over TCP. A video that
# fills a 1920x1080 screen is 3 MB a frame, about 750 Mbit/s at 30 frames a
# second, so the two machines want a link faster than gigabit between them, or
# to be on one host.
#
# The agent is then the only H.264 encoder: there is no fallback. wlshare
# starts without it and says so, and a session that needs H.264 while the
# agent is away, or whose agent fails mid-stream, ends, which the log says;
# the next session tries the agent again. With hardware_h264 off the table is
# not used.
#
# An agent codes for one wlshare at a time: while this one has a stream open
# there, the agent lets nobody in from any other address, and a second
# wlshare set to the same agent is kept out until this one has none, its
# sessions ending meanwhile as with an agent away. Give each wlshare an agent
# of its own.
#
# The two share a key, a file. The agent generates one on first start
# ($XDG_CONFIG_HOME/wlshare/enc_agent.key, or its --key-file); copy it here,
# readable by this account alone. Each end proves the key to the other before
# a picture is sent, and that is all the key does: the pictures cross the
# network in the clear, unauthenticated, so the link is a trusted LAN or a
# tunnel (WireGuard, SSH), never the internet.
#
# A daemon in a virtual machine whose agent is on its host, or in a container
# there, can share memory with it instead of sending it the pictures: QEMU's
# ivshmem-plain device, whose memory the daemon maps here and the agent maps
# as the file on the host behind it (its --shared-memory). The agent places
# each stream's picture in it, and the daemon writes what changed there.
# docs/enc-agent.md, "Shared memory with the guest", says how to set it up.
# [enc_agent]
# address = "192.168.1.20:5990"
# key_file = "/home/me/.config/wlshare/enc_agent.key"   # default: beside this file
# shared_memory = "/sys/bus/pci/devices/0000:00:14.0/resource2_wc"   # default: none

# The keymap the virtual keyboard uploads and keysyms are resolved through, as
# XKB rules/model/layout/variant/options names. Empty means the library default.
# A custom layout directory is named by XKB_CONFIG_EXTRA_PATH in the environment.
[xkb]
# rules = ""
# model = ""
# layout = ""
# variant = ""
# options = ""
