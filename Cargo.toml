# The daemon, with the RFB protocol it speaks inside it; the bytes of its
# private extensions, `wlshare-proto`, which the zDesk gateway depends on too;
# and the VP9 coding, libvpx as `wlshare-vp9` sets it up (see
# docs/architecture.md). The FLAC coding is sound-flac and the Opus coding
# sound-opus, each its own repository.
#
# `default-members` deliberately omits the daemon: it needs libxkbcommon, libpam,
# libpipewire and libavcodec and only runs against a Wayland compositor, so a bare
# `cargo test` on a target covered by libvpx-prebuilt exercises the private
# extensions and the VP9 coding and nothing else. The daemon's tests, the Opus
# ones with the ffmpeg that machine has installed, run where it builds.
# Build the daemon explicitly with `-p wlshare`.
[workspace]
members = ["crates/wlshare-proto", "crates/wlshare-vp9", "crates/wlshare"]
default-members = ["crates/wlshare-proto", "crates/wlshare-vp9"]
resolver = "3"

[workspace.package]
version = "0.0.103"
edition = "2024"
license = "MIT"
repository = "https://github.com/andrewtheguy/wlshare"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
thiserror = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

# wlshare-vp9 and the conversion in front of its encoder (the `yuv` crate)
# optimised in a debug build as in release, so that a debug daemon codes a
# desktop at the speed a released one does, and the VP9 tests run at it.
[profile.dev.package.wlshare-vp9]
opt-level = 3

[profile.dev.package.yuv]
opt-level = 3

# The PNG coding optimised in a debug build as in release, so that a tile is
# coded and read back at the speed it is measured at: `png` itself, the
# `fdeflate` its `Fast` compression and its decoding run on, and the
# `crc32fast` every chunk is checked with.
[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3
