# The daemon, the protocol crate it is built on and the VP9 coding under both,
# libvpx as `wlshare-vp9` sets it up (see docs/architecture.md). The FLAC coding
# is sound-flac and the Opus coding sound-opus, each its own repository.
#
# `default-members` deliberately omits the daemon: it needs libxkbcommon, libpam,
# libpipewire and libavcodec and only runs against a Wayland compositor, so a bare
# `cargo test` on a development machine of any OS exercises the protocol crate
# and the VP9 coding and nothing else, the Opus tests with the ffmpeg that
# machine has installed.
# Build the daemon explicitly with `-p wlshare`.
[workspace]
members = ["crates/wlshare-rfb", "crates/wlshare-vp9", "crates/wlshare"]
default-members = ["crates/wlshare-rfb", "crates/wlshare-vp9"]
resolver = "3"

[workspace.package]
version = "0.0.74"
edition = "2024"
license = "MIT"
repository = "https://github.com/andrewtheguy/wlshare"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
thiserror = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

# wlshare-vp9 and the conversion in front of its encoder (the `yuv` crate)
# optimised in a debug build as in release, so that a debug daemon codes a
# desktop at the speed a released one does, and the VP9 tests run at it.
[profile.dev.package.wlshare-vp9]
opt-level = 3

[profile.dev.package.yuv]
opt-level = 3
